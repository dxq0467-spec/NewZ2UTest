# pytest.ini
[pytest]
# 测试目录
testpaths = Test

# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
addopts = -s  --alluredir=./allure-results
;addopts = -v -s --tb=short --maxfail=2

# 标记
markers =
    smoke: 冒烟测试
    regression: 回归测试
    order_flow: 订单流程测试
    seller: 卖家相关测试
    buyer: 买家相关测试
    dispute1:事件相关测试
    dispute: 纠纷流程专用测试用例标记
    open: 测试相关

;env =ALLURE_LANGUAGE=zh


# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = log/test_log.log
log_file_level = DEBUG
log_file_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S


;allure generate ./allure-results -o ./allure-report --clean --lang zh --name "Z2U测试报告"
;
;allure open ./allure-report
